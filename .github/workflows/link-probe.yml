name: link-probe

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Probe URLs that already appear in registry records
        run: python scripts/check_links.py --probe
